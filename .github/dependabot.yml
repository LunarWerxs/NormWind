version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      routine-runtime-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # Tailwind changes the canonical snapshot and always needs its own
          # compatibility/regeneration pass.
          - tailwindcss
        update-types:
          - minor
          - patch
    # Both prior major-version holds are resolved as of 2026-09-14: @babel/parser is on 8.0.5
    # with engines raised to match it, and eslint-plugin-tailwindcss is on 4.4.0 with its
    # dropped group-data table vendored into lib/vendor/tailwind-classname-groups.mjs. No
    # standing ignore rules remain; a future major on either should surface normally.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
