version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      routine-runtime-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # Tailwind changes the canonical snapshot and always needs its own
          # compatibility/regeneration pass.
          - tailwindcss
        update-types:
          - minor
          - patch
    ignore:
      # @babel/parser 8 declares engines ^22.18.0 || >=24.11.0 (checked against the registry
      # 2026-09-10, v8.0.5). NormWind's floor is >=22, so taking it would ship users a runtime
      # dependency that says it does not support the range we advertise - Node 22.0-22.17 and
      # 24.0-24.10 both fall in the hole. Dropping Node 20 did NOT unblock this; the hold now
      # rests on that gap and ends only if the floor moves again.
      - dependency-name: "@babel/parser"
        update-types:
          - version-update:semver-major
      # v4 removed the internal group-data export NormWind currently uses.
      - dependency-name: eslint-plugin-tailwindcss
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
