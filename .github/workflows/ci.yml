name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Three filesystem semantics: case-sensitive (Linux), case-insensitive
        # with backslash separators (Windows), and case-insensitive-but-
        # preserving (macOS). File discovery and the symlink-loop guard behave
        # differently on each, so all three are exercised.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 24.x matches the runtime the Marketplace Action itself declares
        # (`using: node24` in action.yml).
        #
        # 20.x was dropped 2026-09-10: Node 20 went end-of-life on 2026-04-30, so it
        # receives no security patches and testing it invited people onto it. The Action
        # already ran on node24 and the release job on 22.x, which left this matrix as the
        # only place still claiming 20 mattered. `engines` moved to >=22 with it, because
        # a floor you do not test is not a support claim, it is a guess.
        #
        # `engines` narrowed further to `^22.18.0 || >=24.11.0` on 2026-09-14, taking
        # @babel/parser 8 (it declares that exact range). setup-node's `22.x`/`24.x`
        # always resolve to each line's latest patch, which stays comfortably above
        # both floors, so the matrix values didn't need to change, only this comment.
        node: [22.x, 24.x]
        exclude:
          # Keep the matrix affordable: macOS only needs one Node to cover its
          # filesystem semantics, which is the reason it is here.
          - os: macos-latest
            node: 22.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Smoke test the bundled Marketplace Action
        uses: ./
        with:
          patterns: test/fixtures/family-shorthand/input.tsx
          fail-on-findings: false
          max-annotations: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
